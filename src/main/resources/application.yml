spring:
  application:
    name: optica-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/optica}
    username: ${DB_USER:optica}
    password: ${DB_PASSWORD:optica}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

optica:
  igv: ${IGV_RATE:0.18}
  stock:
    umbral: ${STOCK_UMBRAL:5}
  jwt:
    # En producción definir JWT_SECRET (mínimo 32 caracteres)
    secret: ${JWT_SECRET:clave-local-de-desarrollo-cambiar-en-produccion-2026}
    expiracion-horas: ${JWT_EXPIRACION_HORAS:8}
  cors:
    origenes: ${CORS_ORIGINS:http://localhost:3000}
